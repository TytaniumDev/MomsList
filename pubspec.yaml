name: moms_list
description: A bespoke grocery list app for Mom.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  clock: ^1.1.3
  cloud_firestore: ^7.2.0
  collection: ^1.19.1
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  material_ui: ^1.11.1
  riverpod_annotation: ^4.0.8
  sentry_flutter: ^10.3.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  fake_cloud_firestore: ^4.5.0
  firebase_core_platform_interface: ^8.2.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Lato, SIL Open Font License 1.1 (assets/fonts/lato/OFL.txt).
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato_400Regular.ttf
        - asset: assets/fonts/lato/Lato_700Bold.ttf
          weight: 700
        - asset: assets/fonts/lato/Lato_900Black.ttf
          weight: 900
  assets:
    - assets/fonts/lato/OFL.txt
